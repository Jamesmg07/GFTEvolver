This is the configuration file for numerical parameters relating to the OutputFields analyser.
It simply outputs all of the field arrays with options to do that at the initial timestep, final
timestep, or continually throughout the evolution.

The format is that each line has a description for the parameters to be defined.
Long descriptions can span over multiple lines. Each description ends with a colon.
Multiple parameters on a single line are separated by white space.
Descriptions for boolean parameters are questions and can be set to true (false) with 1 (0).

WARNING: Structural changes to this file may require adjustments to configuration functions.

==================================================================================================

Output both timesteps (current and previous)?             :    0
Output the initial field configuration?                   :    0
Output the final field configuration?                     :    0

Output continually throughout the evolution?              :    0
Number of timesteps between outputs.                      :    10

Path to the initial field configuration data              :    initial_fields.dat
Partial path to the continual field configurations data   :    Continual/fields
Path to the final field configuration data                :    final_fields.dat



This is the configuration file for numerical parameters relating to the GaugeCondition analyser.
It can output integrated and maximum absolute constraint violations over the evolved-site
diagnostic domain. Fixed-support entries in local arrays are placeholders, not diagnostic data.

The format is that each line has a description for the parameters to be defined.
Long descriptions can span over multiple lines. Each description ends with a colon.
Multiple parameters on a single line are separated by white space.
Descriptions for boolean parameters are questions and can be set to true (false) with 1 (0).

WARNING: Structural changes to this file may require adjustments to configuration functions.

==================================================================================================

Path to all global quantities data (e.g total energy)     :    global_quantities_gauge.dat
Output integrated |violation|?                            :    1
Output max |violation|?                                   :    1
Output frequency                                          :    20

Partial path to local quantities data (e.g energy density):    Continual/local_quantities_gauge
Output violation at each grid point                       :    1
Output frequency                                          :    50



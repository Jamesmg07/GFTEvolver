This is the configuration file for numerical parameters relating to the Energy analyser.
It can output energy integrated over the evolved-site diagnostic domain and local energy-density
arrays in full-grid storage order. Fixed-support entries are placeholders, not diagnostic data.

The format is that each line has a description for the parameters to be defined.
Long descriptions can span over multiple lines. Each description ends with a colon.
Multiple parameters on a single line are separated by white space.
Descriptions for boolean parameters are questions and can be set to true (false) with 1 (0).

WARNING: Structural changes to this file may require adjustments to configuration functions.

==================================================================================================

Path to all global quantities data (e.g total energy)     :    global_quantities.dat
Output energy?                                            :    1
Output potential energy?                                  :    1
Output gradient energy?                                   :    1
Output kinetic energy?                                    :    1
Output magnetic energy?                                   :    1
Output electric energy?                                   :    1
Output frequency                                          :    300

Partial path to local quantities data (e.g energy density):    Continual/local_quantities
Output energy density?                                    :    1
Output potential energy density?                          :    0
Output gradient energy density?                           :    0
Output kinetic energy density?                            :    0
Output magnetic energy density?                           :    0
Output electric energy density?                           :    0
Output frequency                                          :    1000



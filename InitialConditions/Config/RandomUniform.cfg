This is the configuration file for numerical parameters relating to the RandomUniform initial conditions.
Field values are initialised randomly based on a uniform probability distribution.

The format is that each line has a description for the parameters to be defined.
Long descriptions can span over multiple lines. Each description ends with a colon.
Multiple parameters on a single line are separated by white space.
Descriptions for boolean parameters are questions and can be set to true (false) with 1 (0).

WARNING: Structural changes to this file may require adjustments to configuration functions.


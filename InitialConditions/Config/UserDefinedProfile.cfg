This is the configuration file for the user-defined position-dependent initial-condition template.
It accompanies UserDefinedProfile.cpp, where users implement the actual profile functions.

The format is that each line has a description for the parameters to be defined.
Long descriptions can span over multiple lines. Each description ends with a colon.
Profile-data filenames must not contain whitespace. Enter NONE when no file is required.

The blank template does not load or apply profile data until its user sections are implemented.
Add further profile parameters here and read them in UserDefinedProfile::configure() as required.

WARNING: Structural changes to this file may require adjustments to the configure function.

==================================================================================================

Scalar profile-data filename (NONE if unused)             :    NONE
Gauge profile-data filename (NONE if unused)              :    NONE
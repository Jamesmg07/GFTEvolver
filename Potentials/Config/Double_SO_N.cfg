This is the configuration file for setting up an SO_N x SO_M potential.
In general any number of scalar field components are allowed, and it is only required to set N (cannot be larger than the
total number of components) and M will be determined based on the total number of field components.

However, some of the allowed parameters will explicitly break the symmetry down to a single SO_N. 
These parameters are only used if the boolean to force the same number of components is set to true 
which requires the total number of scalar field components to be 2N.
Potential has the form:

V = V_full + V_single + V_U, where

V_full = -m1*|f1|^2 - m2*|f2|^2 + l1*|f1|^4 + l2*|f2|^4 + l3*|f1|^2|f2|^2,
which is the part of the potential that is symmetric under SO(N) x SO(M) symmetry. f1 is an N component field and f2 is an M component field.

In order for V_single to be used, f1 and f2 need to have the same number of components, as there will now just be a single SO(N) symmetry that
acts the same way on both fields. Potential parameters below will only be used if a boolean is set to true.

V_single = -m12r*f1^T*f2 + l4p5*(f1^T*f2)^2 + l6r*|f1|^2(f1^T*f2) + l7r*|f2|^2(f1^T*f2),
which are all of the terms that can be formed from dot products of the two field vectors (v^T*u should be understood to be the dot product of v and u).

The next part of the potential will further explicitly break the symmetry down to U(N/2), as it includes terms like f1^T*J*f2,
where J = I_{N/2} \otimes \epsilon and \epsilon is the 2x2 antisymmetric tensor ((0 1) (-1 0)). This seems like a slightly odd construction,
but in the language of complex (N/2)-tuples, it is simply Im(\Phi_1^\dagger\Phi_2), whereas f1^T*f2 is Re(\Phi_1^\dagger\Phi_2).

V_U = +m12i*f1^T*J*f2 + l4m5*(f1^T*Jf2)^2 - 2*l5i*(f1^T*f2)*(f1^T*J*f2) - l6i*|f1|^2*(f1^T*J*f2) - l7i*|f2|^2*(f1^T*J*f2).

The names of these parameters have been chosen based off of the 2HDM, so that r and i label the real and imaginary parts of
the 2HDM parameters. l4p5 refers to \lambda_4 + Re(\lambda5) and l4m5 refers to \lambda_4 - Re(\lambda_5).



The format is that each line has a description for the parameters to be defined.
Long descriptions can span over multiple lines. Each description ends with a colon.
Multiple parameters on a single line are separated by white space.
Descriptions for boolean parameters are questions and can be set to true (false) with 1 (0).

WARNING: Structural changes to this file may require adjustments to configuration functions.


Three types of boundary conditions, corresponding to the
walls (2D), edges (1D) and corners (0D) boundaries.
Each one has the same options which are fixed [1],
neumann [2] and periodic [3].
Wall boundary condition options. Six choices should be
made which correspond with the (-x), (+x), (-y), (+y),
(-z) and (+z) boundaries respectively.                    :    3 3 3 3 3 3
Edge boundary condition options. Twelve choices should be
made which correspond with the (-x,-y), (-x,+y), (+x,-y),
(+x,+y), (-x,-z), (-x, +z), (+x,-z), (+x,+z), (-y,-z),
(-y,+z), (+y,-z) and (+y,+z) boundaries respectively.     :    3 3 3 3 3 3 3 3 3 3 3 3
Corner boundary condition options. Eight choices should be
made which correspond with the (-x,-y,-z), (-x,-y,+z),
(-x,+y,-z), (-x,+y,+z), (+x,-y,-z), (+x,-y,+z),
(+x,+y,-z) and (+x,+y,+z) boundaries.                     :    3 3 3 3 3 3 3 3

